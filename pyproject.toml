[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unilog-product-intelligence"
version = "0.1.0"
description = "Evidence-constrained product intelligence for industrial commerce."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "UniLog Product Intelligence contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "google-genai==2.18.1",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "types-openpyxl>=3.1,<4.0",
]

[project.scripts]
unilog-api = "unilog_product_intelligence.api:run"
unilog-inspect-data = "unilog_product_intelligence.data.cli:inspect_data_main"
unilog-validate-delivery = "unilog_product_intelligence.data.cli:validate_delivery_main"
unilog-phase4 = "unilog_product_intelligence.agents.cli:phase4_main"
unilog-phase5 = "unilog_product_intelligence.retrieval.cli:phase5_main"
unilog-phase6 = "unilog_product_intelligence.enrichment.cli:phase6_main"
unilog-cost-plan = "unilog_product_intelligence.application.scale_cli:cost_plan_main"
unilog-gemini-diagnostics = "unilog_product_intelligence.application.scale_cli:diagnostics_main"

[tool.hatch.build.targets.wheel]
packages = ["src/unilog_product_intelligence"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
exclude = ['^\\.venv/']



